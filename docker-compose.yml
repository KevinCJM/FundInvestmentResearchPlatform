services:
  fund-research:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      PORT: 8000
      # Leave empty for same-origin deployment. Set the public frontend origin
      # only when a separate frontend is deployed.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      DATA_REFRESH_ENABLED: ${DATA_REFRESH_ENABLED:-false}
      TUSHARE_TOKEN_CONFIG_ENABLED: ${TUSHARE_TOKEN_CONFIG_ENABLED:-true}
      DATA_FULL_REFRESH_ENABLED: ${DATA_FULL_REFRESH_ENABLED:-false}
      DATA_REFRESH_TIMEOUT_SECONDS: ${DATA_REFRESH_TIMEOUT_SECONDS:-1800}
      DATA_FULL_REFRESH_TIMEOUT_SECONDS: ${DATA_FULL_REFRESH_TIMEOUT_SECONDS:-86400}
      TUSHARE_MAX_CALLS_PER_MINUTE: ${TUSHARE_MAX_CALLS_PER_MINUTE:-180}
      TUSHARE_MIN_CALL_INTERVAL_SECONDS: ${TUSHARE_MIN_CALL_INTERVAL_SECONDS:-0.34}
      TUSHARE_MAX_WORKERS: ${TUSHARE_MAX_WORKERS:-8}
      TUSHARE_MAX_RETRIES: ${TUSHARE_MAX_RETRIES:-5}
      TUSHARE_RETRY_BACKOFF_SECONDS: ${TUSHARE_RETRY_BACKOFF_SECONDS:-2.0}
      TUSHARE_RATE_LIMIT_WAIT_SECONDS: ${TUSHARE_RATE_LIMIT_WAIT_SECONDS:-15.0}
      TUSHARE_RETRY_JITTER_SECONDS: ${TUSHARE_RETRY_JITTER_SECONDS:-0.5}
      TUSHARE_MAX_LATEST_DAYS: ${TUSHARE_MAX_LATEST_DAYS:-120}
      TUSHARE_MAX_FUND_BASIC_PAGES: ${TUSHARE_MAX_FUND_BASIC_PAGES:-20}
      TUSHARE_MAX_FUND_NAV_PAGES: ${TUSHARE_MAX_FUND_NAV_PAGES:-20}
      TUSHARE_FUND_NAV_PAGE_SIZE: ${TUSHARE_FUND_NAV_PAGE_SIZE:-10000}
      TUSHARE_FULL_START_DATE: ${TUSHARE_FULL_START_DATE:-20100101}
      TUSHARE_HISTORY_CHUNK_DAYS: ${TUSHARE_HISTORY_CHUNK_DAYS:-3650}
      INDICATOR_BATCH_ENGINE_V2: ${INDICATOR_BATCH_ENGINE_V2:-on}
      INDICATOR_PROCESS_WORKERS: ${INDICATOR_PROCESS_WORKERS:-7}
      INDICATOR_STARTUP_WARMUP_TIMEOUT_SECONDS: ${INDICATOR_STARTUP_WARMUP_TIMEOUT_SECONDS:-120}
      INDICATOR_QUEUE_WAIT_SECONDS: ${INDICATOR_QUEUE_WAIT_SECONDS:-1}
      INDICATOR_RUN_HARD_TIMEOUT_SECONDS: ${INDICATOR_RUN_HARD_TIMEOUT_SECONDS:-600}
      INDICATOR_PRANGE_MIN_ELEMENTS: ${INDICATOR_PRANGE_MIN_ELEMENTS:-300000}
      INDICATOR_SHM_THRESHOLD_BYTES: ${INDICATOR_SHM_THRESHOLD_BYTES:-536870912}
      INDICATOR_CACHE_TTL_SECONDS: ${INDICATOR_CACHE_TTL_SECONDS:-300}
      INDICATOR_PLAN_CACHE_ENTRIES: ${INDICATOR_PLAN_CACHE_ENTRIES:-32}
      INDICATOR_DATA_CACHE_BYTES: ${INDICATOR_DATA_CACHE_BYTES:-536870912}
      INDICATOR_WINDOW_CACHE_BYTES: ${INDICATOR_WINDOW_CACHE_BYTES:-268435456}
      INDICATOR_INLINE_RESULT_LIMIT: ${INDICATOR_INLINE_RESULT_LIMIT:-2000}
      INDICATOR_RESULT_TTL_SECONDS: ${INDICATOR_RESULT_TTL_SECONDS:-1800}
      INDICATOR_RESULT_MAX_RUNS: ${INDICATOR_RESULT_MAX_RUNS:-20}
      INDICATOR_RESULT_MAX_BYTES: ${INDICATOR_RESULT_MAX_BYTES:-2147483648}
      INDICATOR_ORPHAN_PROTECTION_SECONDS: ${INDICATOR_ORPHAN_PROTECTION_SECONDS:-60}
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    shm_size: "1gb"
    volumes:
      - fund_data:/app/data
    restart: unless-stopped

volumes:
  fund_data:
