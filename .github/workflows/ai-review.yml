name: Submission gates
on:
  pull_request_target:
    branches: [main, Dev]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main, Dev]
  workflow_run:
    workflows: [PR quality validation]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-review-gate
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ai-review.yml --ref main
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
      checks: write
    steps:
      - name: Read the trusted workflow version only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check_ai_review.py
            scripts/check_submission.py
            scripts/submission_policy.py
          sparse-checkout-cone-mode: false
      - name: Validate and publish three gates on each PR HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_POLICY_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          # Every event scans all PRs, so replacement of a pending concurrency
          # run cannot lose a base-update revalidation for another PR.
          python3 scripts/check_submission.py --publish
