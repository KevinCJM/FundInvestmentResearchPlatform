server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /assistant/widget/ {
        proxy_pass http://portable-agent:8787/widget/;
    }
    location ^~ /assistant/v2/apps/ {
        proxy_pass http://portable-agent:8787/v2/apps/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /assistant { return 404; }
    location / { proxy_pass http://fund-research:8000; }
}
