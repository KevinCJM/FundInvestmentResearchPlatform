name: PR quality validation
run-name: 'quality PR ${{ github.event.pull_request.number || inputs.pr }} head:${{ github.event.pull_request.head.sha || inputs.head_sha }} base:${{ github.event.pull_request.base.sha || inputs.base_sha }}'
on:
  pull_request:
    branches: [main, Dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: quality-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
env:
  CUSTOM_INDICATOR_DATA_DIR: /tmp/firp-ci-indicator-data
  NUMBA_CACHE_DIR: /tmp/firp-ci-numba-cache
  TUSHARE_TOKEN: ''
  CI: 'true'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      # The planner is protected code even when the workflow is triggered by a PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: python3 trusted/scripts/ci_quality.py
  governance:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
          path: trusted
          sparse-checkout: skills
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - working-directory: candidate
        run: |
          python3 ../trusted/skills/ai-hermes-self-evolve/scripts/validate_ai_routing.py --project-root "$PWD"
          python3 ../trusted/skills/ai-hermes-self-evolve/scripts/route_task.py --project-root "$PWD" --route-id R03 --mode context
      - env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        working-directory: candidate
        run: |
          python3 ../trusted/skills/ai-hermes-self-evolve/scripts/evolve_ai_routing.py --project-root "$PWD" --diff-range "$BASE_SHA...$HEAD_SHA" --json
          git diff --check "$BASE_SHA...$HEAD_SHA"
  policy-tests:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Exercise candidate routing executables in their isolated runner
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        run: |
          python3 -m compileall -q skills
          python3 skills/ai-hermes-self-evolve/scripts/validate_ai_routing.py
          python3 skills/ai-hermes-self-evolve/scripts/route_task.py --route-id R02 --mode context
          python3 skills/ai-hermes-self-evolve/scripts/route_task.py --route-id R03 --mode context
          python3 skills/ai-hermes-self-evolve/scripts/evolve_ai_routing.py --diff-range "$BASE_SHA...$HEAD_SHA" --json
      - name: Run nonempty candidate test suite
        run: |
          python3 -I - <<'CONTROLLER'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          child = "import json, sys, unittest\nfrom pathlib import Path\nsuite = unittest.defaultTestLoader.discover(sys.argv[2], pattern='test_*.py')\ncount = suite.countTestCases()\nresult = unittest.TextTestRunner(verbosity=2).run(suite)\nPath(sys.argv[1]).write_text(json.dumps({'count': count, 'testsRun': result.testsRun,\n    'success': result.wasSuccessful(), 'skipped': len(result.skipped), 'expectedFailures': len(result.expectedFailures)}))\n"
          with tempfile.TemporaryDirectory() as directory:
              report = Path(directory, 'completed.json')
              run = subprocess.run([sys.executable, '-E', '-P', '-c', child, str(report), 'scripts/tests'], timeout=300)
              assert run.returncode == 0 and report.is_file(), 'Test process did not complete'
              result = json.loads(report.read_text())
              assert set(result) == {'count', 'testsRun', 'success', 'skipped', 'expectedFailures'}
              assert type(result['count']) is int and result['count'] > 0, 'Test suite is empty'
              assert type(result['testsRun']) is int and result['testsRun'] == result['count'], 'Test suite was incomplete'
              assert result['success'] is True and result['skipped'] == 0 and result['expectedFailures'] == 0, 'Tests did not all pass'
              print('All', result['testsRun'], 'policy tests completed successfully')
          CONTROLLER
      - name: Exercise candidate protected contracts
        run: |
          python3 -I - <<'CONTROLLER'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          child = "import json, sys, unittest\nfrom pathlib import Path\nsuite = unittest.defaultTestLoader.discover(sys.argv[2], pattern='test_*.py')\ncount = suite.countTestCases()\nresult = unittest.TextTestRunner(verbosity=2).run(suite)\nPath(sys.argv[1]).write_text(json.dumps({'count': count, 'testsRun': result.testsRun,\n    'success': result.wasSuccessful(), 'skipped': len(result.skipped), 'expectedFailures': len(result.expectedFailures)}))\n"
          with tempfile.TemporaryDirectory() as directory:
              report = Path(directory, 'completed.json')
              run = subprocess.run([sys.executable, '-E', '-P', '-c', child, str(report), 'scripts/protected_tests'], timeout=300)
              assert run.returncode == 0 and report.is_file(), 'Test process did not complete'
              result = json.loads(report.read_text())
              assert set(result) == {'count', 'testsRun', 'success', 'skipped', 'expectedFailures'}
              assert type(result['count']) is int and result['count'] > 0, 'Test suite is empty'
              assert type(result['testsRun']) is int and result['testsRun'] == result['count'], 'Test suite was incomplete'
              assert result['success'] is True and result['skipped'] == 0 and result['expectedFailures'] == 0, 'Tests did not all pass'
              print('All', result['testsRun'], 'policy tests completed successfully')
          CONTROLLER
  protected-policy-tests:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            scripts/protected_tests
            .github/workflow-contracts.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
          path: candidate
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Verify workflow integrity before importing candidate code
        run: |
          python3 - <<'INTEGRITY'
          import hashlib, json, re
          from pathlib import Path
          import yaml
          names = {'ai-review.yml', 'quality-gate.yml', 'review-events.yml', 'branch-ruleset.json'}
          for owner in ['trusted', 'candidate']:
              contract = json.loads(Path(owner, '.github/workflow-contracts.json').read_text())
              assert set(contract) == names, 'Unexpected workflow contract inventory'
              for name, accepted in contract.items():
                  assert isinstance(accepted, list) and accepted, 'Empty workflow contract'
                  assert all(isinstance(item, str) and re.fullmatch(r'[0-9a-f]{64}', item) for item in accepted)
                  document = (json.loads(Path('candidate/.github', name).read_text()) if name.endswith('.json')
                              else yaml.load(Path('candidate/.github/workflows', name).read_text(), Loader=yaml.BaseLoader))
                  digest = hashlib.sha256(json.dumps(document, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                  assert digest in accepted, f'Unreviewed or inconsistent workflow configuration: {owner}/{name}'
          INTEGRITY
      - name: Run protected contracts against candidate gate modules
        env:
          FIRP_GATE_ROOT: ${{ github.workspace }}/candidate
        run: |
          python3 -I - <<'CONTRACTS'
          import unittest
          suite = unittest.defaultTestLoader.discover('trusted/scripts/protected_tests', pattern='test_*.py')
          count = suite.countTestCases()
          assert count > 0, 'Test suite is empty'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == count, 'Test suite was incomplete'
          assert result.wasSuccessful() and not result.skipped and not result.expectedFailures, 'Protected contracts failed'
          CONTRACTS
  frontend:
    needs: prepare
    if: needs.prepare.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - working-directory: frontend
        run: |
          npm ci
          npm exec vitest -- run
          npm exec tsc -- --noEmit
          npm run build
          npm run i18n:check
          npm run design:check
  backend:
    needs: prepare
    if: needs.prepare.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r .github/requirements-ci.txt
      - run: python -m pytest backend/tests -q --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1
  e2e:
    needs: prepare
    if: needs.prepare.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r .github/requirements-ci.txt
      - working-directory: frontend
        run: |
          npm ci
          npm exec playwright -- install --with-deps chrome
          export INDICATOR_TEST_PYTHON="$(command -v python)"
          export TEST_PYTHON="$INDICATOR_TEST_PYTHON"
          npm exec playwright -- test --workers=2
  quality-result:
    needs: [prepare, governance, policy-tests, protected-policy-tests, frontend, backend, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert jobs['prepare']['result'] == 'success'
          assert jobs['governance']['result'] == 'success'
          assert jobs['policy-tests']['result'] == 'success'
          assert jobs['protected-policy-tests']['result'] == 'success'
          for name in ['frontend', 'backend', 'e2e']:
              wanted = 'success' if jobs['prepare']['outputs'][name] == 'true' else 'skipped'
              assert jobs[name]['result'] == wanted, (name, wanted, jobs[name]['result'])
          print('All applicable quality jobs succeeded on the prepared HEAD/base.')
          PY
