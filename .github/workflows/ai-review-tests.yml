name: AI review workflow validation
on:
  pull_request:
    branches: [main, Dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test gate decisions without network or application data
        run: python3 -m unittest discover -s scripts/tests -p 'test_ai_review.py' -v
      - name: Validate routing contracts
        run: |
          python3 skills/ai-hermes-self-evolve/scripts/validate_ai_routing.py
          python3 skills/ai-hermes-self-evolve/scripts/route_task.py --route-id R03 --mode context
